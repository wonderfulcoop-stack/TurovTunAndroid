name: Build TurovTun Android REAL APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TurovTun builder
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc-dev make python3 python3-pip git unzip zip
          python3 -m pip install --user pillow
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Build real VPN APK
        run: bash scripts/build_turovtun.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurovTun-real-working-apk
          path: output/*.apk
          if-no-files-found: error
